[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemesis-toolkit"
version = "1.0.0"
description = "Authorized-use Python CLI toolkit for reconnaissance and non-destructive vulnerability detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shayan Ahmed" }]
keywords = ["security", "recon", "vulnerability-scanner", "authorized-testing", "nemesis", "cybersecurity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12.3",
  "httpx[http2]>=0.27.0",
  "rich>=13.7.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pydantic-settings[yaml]>=2.2.0",
  "PyYAML>=6.0.1",
  "dnspython>=2.6.0",
  "beautifulsoup4>=4.12.0",
  "Jinja2>=3.1.0",
  "geoip2>=4.8.0",
  "questionary>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "pytest-httpserver>=1.0.0",
]

[project.scripts]
nemesis = "nemesis_toolkit.main:main"
nemesis-toolkit = "nemesis_toolkit.main:main"

[tool.setuptools.packages.find]
include = ["nemesis_toolkit*"]

[tool.setuptools.package-data]
nemesis_toolkit = ["templates/*.html.j2", "data/*.txt", "native/*.pyd", "native/*.so", "native/bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
